name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run obsolete; don't pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The floor declared in package.json engines (pdfjs-dist needs
          # >=22.13). Testing on the floor rather than on whatever Vercel
          # happens to run means a version-specific break shows up here.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # The two fixtures that embed a system font are not in the repo and no
      # font is installed on the runner, so the five tests that need them skip.
      # Everything else runs from the committed fixtures.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Identifiers, not credentials — useless without the token below.
      VERCEL_ORG_ID: team_c3OpqPRfdIA2xYhvEdzoNkjd
      VERCEL_PROJECT_ID: prj_wb7eVOtnWkHHtJq20HjYoppW3zYd
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Explain a missing token instead of failing
        if: env.VERCEL_TOKEN == ''
        run: |
          {
            echo "### Deploy skipped"
            echo
            echo "No \`VERCEL_TOKEN\` secret is set on this repository."
            echo
            echo "Either connect the repo to Vercel from the dashboard (Vercel then"
            echo "deploys on its own and this job stays dormant), or add a token at"
            echo "**Settings → Secrets and variables → Actions** to deploy from here."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v5
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: '22'
          cache: npm

      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@50 deploy --prod --yes --token "$VERCEL_TOKEN"
